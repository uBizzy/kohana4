# nginx: an example of a site that runs Kohana. Copy it to the sites of
# nginx (/etc/nginx/sites-available/), change the names and paths, and
# check it with "nginx -t".
#
# The security headers of the pages are sent by the framework itself: see
# HTTP::$security_headers in application/bootstrap.php. This file covers
# what never reaches PHP.

server {
	listen 80;
	server_name example.com;

	# Send everybody to HTTPS, once the site has a certificate
	#return 301 https://$host$request_uri;

	# Only the public directory can be reached from the web
	root /var/www/example/public;
	index index.php;

	# Hidden files and directories (.git, .env) are not served.
	# /.well-known/ stays open: certificates and apps look there
	location ~ /\.(?!well-known/) {
		return 403;
	}

	# Real files are served as they are; everything else goes to index.php
	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	# PHP runs through index.php only: a .php file that ends up in this
	# directory by mistake, or by an attack on an upload, is not run
	location = /index.php {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
		fastcgi_param KOHANA_ENV production;
		fastcgi_pass unix:/run/php/php8.4-fpm.sock;
	}

	location ~ \.php$ {
		return 403;
	}

	# CSS, JavaScript, images and fonts: the browser keeps them, and asks
	# each time whether they changed ("304 Not Modified" when not)
	location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff";
		try_files $uri /index.php$is_args$args;
	}

	# Text is sent compressed
	gzip on;
	gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

	# nginx does not say which version it is
	server_tokens off;
}
